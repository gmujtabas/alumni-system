<!doctype html>
<html lang="en">

<head>
  <link rel="stylesheet" href="../css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni System - Register</title>
</head>

<body>

 <div class="header">

   <div class="logo">
     <a href="index.html">
       <img src="../images/logo-white.png" alt="Alumni System Logo">
     </a>

     <h1>Alumni System</h1>
   </div>

   <div class="navigation">
     <a href="index.html">Home</a>
     <a href="login.html">Login</a>
     <a href="register.html">Register</a>
     <a href="profile.html">Profile</a>
     <a href="alumni.html">Alumni</a>
   </div>

 </div>

  <div class="register-container">

    <h2>Register</h2>
    <p><u>Create your Alumni Account</u></p>

    <form>

      <p>
        <label for="fullname">Full Name:</label>
      </p>
      <input type="text" id="fullname" name="fullname"
             placeholder="Enter your full name">

      <p>
        <label for="username">Username:</label>
      </p>
      <input type="text" id="username" name="username"
             placeholder="Enter your username">

      <p>
        <label for="email">Email:</label>
      </p>
      <input type="email" id="email" name="email"
             placeholder="Enter your email">

      <p>
        <label for="password">Password:</label>
      </p>
      <input type="password" id="password" name="password"
             placeholder="Enter your password">

      <p>
        <label for="confirmPassword">Confirm Password:</label>
      </p>
      <input type="password" id="confirmPassword" name="confirmPassword"
             placeholder="Confirm your password">

      <p>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
      </p>

    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login to your account</a>

  </div>

  <div class="footer">
    <p>&copy; 2026 Alumni System. All Rights Reserved.</p>
  </div>

</body>

</html>

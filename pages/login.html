<!doctype html>
<html lang="en">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni System - Login</title>
</head>

<body>



  <nav class="navbar navbar-expand-lg navbar-dark py-3" style="background-color:#011C37;">
    <div class="container">

  <a class="navbar-brand d-flex align-items-center" href="../index.html">
    <img src="../images/logo-white.png" alt="Alumni System Logo" width="100" class="me-2">
    Alumni System
  </a>

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">

      <li class="nav-item">
        <a class="nav-link" href="../index.html">
          Home
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link active" href="login.html">
          Login
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="register.html">
          Register
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="profile.html">
          Profile
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="alumni.html">
          Alumni
        </a>
      </li>

    </ul>
  </div>
</div>

</nav>



  <hr>




  <div class="container mt-5 mb-5">
<div class="card shadow mx-auto" style="max-width:500px;">
  <div class="card-body p-5">

    <h2 class="text-center mb-3">
      Login
    </h2>

    <p class="text-center mb-4">
      <u>Login to your Alumni Account</u>
    </p>

    <form>

      <div class="mb-3">

        <label for="username" class="form-label">
          Username:
        </label>

        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username">
      </div>


      <div class="mb-4">
        <label for="password" class="form-label">
          Password:
        </label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
      </div>

       <div class="text-center">
        <button type="submit" class="btn text-white me-2" style="background-color:#011C37;">
          Login
        </button>

        <button type="reset" class="btn btn-secondary">
          Clear
        </button>

      </div>
    </form>


    <div class="text-center mt-4">

      <p class="mb-1">
        Don't have an account?
      </p>

      <a href="register.html">
        Create a new account
      </a>

    </div>
  </div>
</div>


</div>


  <hr>


  <div class="footer text-center py-3" style="background-color:#011C37; color:white;">

<p class="mb-0">

</p>
